# Activate only after creating the dedicated Sonar project and GitHub secret.
sonar.organization=cblgn
sonar.projectKey=cblgn_rythmo
sonar.projectName=Rythmo
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=app/src/main,core/src/main,server/src/main,scripts,.github/workflows
sonar.tests=app/src/test,core/src/test,scripts/tests,tests
sonar.exclusions=scripts/tests/**,scripts/extract-rubric.py,**/build/**,**/__pycache__/**
sonar.java.binaries=app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes,core/build/classes/kotlin/main,server/build/classes/kotlin/main
sonar.junit.reportPaths=app/build/test-results/testDebugUnitTest,core/build/test-results/test
sonar.python.version=3.12
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/coverage/test/debug/report.xml,core/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=build/reports/js/lcov.info
sonar.python.coverage.reportPaths=build/reports/python/coverage.xml
