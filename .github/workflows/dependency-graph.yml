name: Dependency graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Classify build/test tools accurately without excluding any dependencies.
      DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '^(debugRuntimeClasspath|releaseRuntimeClasspath|runtimeClasspath)$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0"'
      - name: Resolve and save graph without a write token
        id: graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          dependency-graph: generate-and-upload
          artifact-retention-days: 2
      - name: Export all resolved dependencies for the vulnerability audit
        env:
          SNAPSHOT: ${{ steps.graph.outputs.dependency-graph-file }}
        run: python3 scripts/dependency-inventory.py "$SNAPSHOT" "$RUNNER_TEMP/osv-scanner.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-inventory
          path: ${{ runner.temp }}/osv-scanner.json
          if-no-files-found: error
          retention-days: 2

  audit:
    name: Dependency vulnerability audit
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-inventory
          path: ${{ runner.temp }}/dependency-inventory
      - run: python3 scripts/ci-tools.py osv-scanner
      - name: Fail on known vulnerabilities in all dependency scopes
        run: .tools/ci/osv-scanner scan source --lockfile "osv-scanner:$RUNNER_TEMP/dependency-inventory/osv-scanner.json"
