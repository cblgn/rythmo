name: SonarQube Cloud

# Optional external connection, main only; never required for PRs on the Free plan.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-main
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarQube Cloud analysis
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false && vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce CI-only analysis
        run: python3 scripts/sonar_analysis_mode.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - run: ./gradlew --no-daemon test assembleDebug :server:classes :app:createDebugUnitTestCoverageReport :core:jacocoTestReport
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install console test dependencies
        run: npm ci --ignore-scripts
      - name: JavaScript and Python coverage
        run: |
          mkdir -p build/reports/js
          node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=build/reports/js/lcov.info tests/*.test.cjs
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          "$RUNNER_TEMP/coverage-venv/bin/pip" install -r scripts/coverage-requirements.txt
          "$RUNNER_TEMP/coverage-venv/bin/python" -m coverage run -m unittest discover -s scripts/tests
          "$RUNNER_TEMP/coverage-venv/bin/python" -m coverage xml
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          skipSignatureVerification: false
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
